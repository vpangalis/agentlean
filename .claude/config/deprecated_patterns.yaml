# Deprecated-pattern registry for the PreToolUse drift-check hook.
#
# Read by .claude/hooks/pre-tool-use-drift-check.py, which blocks Write/Edit/
# MultiEdit operations whose content matches a pattern (unless the target path
# is grandfathered by a path_exclusion). Additions and exclusions are made as
# audit-trailed commits — this file is the versioned governance record.
#
# path_exclusions use gitignore-style globs; they grandfather existing v1 code
# scheduled for deletion during the arch-v2 migration.
#
# ── The governance-documentation exclusion ──────────────────────────────
#
# 'agent-improve/*.md' and 'agent-improve/**/*.md' appear on patterns 2–8.
# The principle was stated on pattern-2 when it was first excluded:
#
#     "this registry guards code, not documentation."
#
# The governance documents — CLAUDE.md, AGENTIC_ARCHITECTURE_REFERENCE.md, and the
# records under docs/ — must be able to NAME a deprecated construct in order
# to prohibit it, show it beside its replacement, or record why it was
# retired. A registry that blocks the sentence "never write X in a phase
# executor" prevents the documentation of the very rule it enforces.
#
# The exclusion was applied to pattern-2 alone and never propagated. Patterns
# 3–8 received it on 2026-08-21, completing an already-established treatment
# rather than making a new governance decision. No code path that any pattern
# guards has changed.
#
# pattern-1 is deliberately NOT excluded: its regex matches a literal import
# statement rather than a bare name that prose would need to quote.
#
# The registry file itself is exempt from the check — see is_registry_itself()
# in the hook. That is a bootstrapping fix, not an exclusion: several message:
# fields below quote the literals they ban, so without it this file could not
# be edited by the normal tooling at all.
#
# Not active until commit 0.5.3 registers the hook in .claude/settings.json.

version: 1
patterns:
  - id: pattern-1-create-react-agent
    regex: 'from\s+langgraph\.prebuilt\s+import.*create_react_agent'
    message: "create_react_agent is superseded by create_agent (LangChain 1.0+, EDUCATIONAL §25b). Import from langchain.agents instead."
    severity: block
    path_exclusions: []

  - id: pattern-3-response-content-parsing
    regex: 'response\.content\s*\['
    message: "Do not string-parse response.content in phase executors. Read response.content_blocks (typed) per LangChain 1.0 (EDUCATIONAL §81). CLAUDE.md §4.5."
    severity: block
    path_exclusions:
      # Governance documentation — see header.
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'

  - id: pattern-4-custom-saga
    regex: '(class\s+\w*Saga\b|def\s+\w*compensat)'
    message: "Custom Saga/compensating-action code is superseded by native error_handler= on LangGraph 1.2+ nodes (EDUCATIONAL §79). CLAUDE.md §3.6."
    severity: block
    path_exclusions:
      # Governance documentation — see header.
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'

  - id: pattern-6-set-entry-point
    regex: '\.set_entry_point\s*\('
    message: "set_entry_point() is superseded. Use add_edge(START, ...) per LangGraph 1.x pattern (EDUCATIONAL §45 example code)."
    severity: block
    path_exclusions:
      # Governance documentation — see header.
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'

  - id: pattern-7-sync-graph-invoke
    regex: '(?<!a)graph\.invoke\s*\('
    message: "Synchronous graph.invoke() violates CLAUDE.md §1.4 (async by default). Use await graph.ainvoke(...) instead."
    severity: block
    path_exclusions:
      # Governance documentation — see header.
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'

  - id: pattern-2-with-structured-output
    regex: '\.with_structured_output\s*\('
    message: ".with_structured_output() is deprecated in v2.2. Prefer response_format= on create_agent with LangChain 1.2 auto-inference (EDUCATIONAL §82). CLAUDE.md §4.6."
    severity: block
    path_exclusions:
      - 'agent-resolve/**'
      # Architecture markdown deliberately shows the superseded and the ratified
      # form side by side; this registry guards code, not documentation.
      # REVIEW_DECISIONS.md ratifies the builder-style structured-output call for
      # plain LLM invocations inside tools and middleware, where response_format=
      # on create_agent does not apply (§32, §33, §37, §42, §48, §68).
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'
      - 'agent-improve/backend/phases/**/orchestrate.py'
      - 'agent-improve/backend/phases/**/validate.py'
      # ── The §4.6 scoping, added 2026-09-03 (procedure step 5.2) ─────────
      #
      # CLOSES THE UPDATE CLAUDE.md §18.1 RECORDS AS OWED. This entry's
      # message says "deprecated in v2.2", which is THIS PROJECT'S doc
      # version and applies to AGENT CONSTRUCTION only. CLAUDE.md §4.6
      # replaced v2.1's §4.3 and scoped the mechanism by call type:
      #
      #   an agent built with create_agent   -> response_format=Schema
      #   a plain model call inside a tool,
      #   middleware, or validator           -> the builder-style call
      #
      # and §4.6's own mapping table names the site this unblocks:
      # "Inside rag_lookup_* | Plain LLM call | QueryVariants |
      # with_structured_output". REVIEW_DECISIONS.md ratifies the same
      # scoping (§32, §33, §37, §42, §48, §68) — as the comment above
      # already states. The exclusion list simply predated the files.
      #
      # Verified 2026-09-03 against the installed langchain-core 1.6.0:
      # BaseChatModel.with_structured_output carries NO upstream deprecation
      # marker. The block was ours, and it was over-broad.
      #
      # STILL BLOCKING where response_format= applies — notably
      # phases/**/nodes.py, where the executor is built with create_agent at
      # step 6.2. That is the case this pattern exists for.
      - 'agent-improve/backend/knowledge/**'
      - 'agent-improve/backend/middleware/**'
      # ── The §4.6 PLANNER + VALIDATOR scoping, 2026-09-03 (step 6.1) ─────
      #
      # The 5.2 scoping above named tools and middleware. **§4.6's clause has
      # three call sites, not two** — "a plain model invocation inside a tool,
      # middleware, OR VALIDATOR" — and the phase planner is a fourth site the
      # same rule covers explicitly. Both were blocked by a list that predated
      # the files, which is the failure mode the comment above already named.
      #
      # THE PHASE PLANNER. §4.6's mapping table, row 1:
      #   "Phase planner | Plain LLM call | CoachingPlan | with_structured_output"
      # §17 prints the invocation form as canonical — `phase_planner =
      # llm.with_structured_output(CoachingPlan)` — and S-C04 states why
      # response_format= cannot substitute: it is "a plain model invocation,
      # not an agent, so response_format= does not apply". There is no
      # model-tools loop to attach it to; §17 forbids the planner dispatching
      # to tools at all.
      #
      # SINGLE FILE, NOT phases/**. Deliberately narrow. A phases/** exclusion
      # would also un-block phases/**/nodes.py — named directly above as "the
      # case this pattern exists for" — one step before step 6.2 builds the
      # executor there with create_agent. The planner's call site is the one
      # file the five phases' node bodies delegate to (§13), so one glob covers
      # all five without widening to the directory.
      #
      # The alternative considered and rejected: split the planner's LLM call
      # into its own module so the glob could be even narrower. That would put
      # one node's private helper outside `nodes_common.py` to suit a
      # path-based guard, against §13's "the bodies live in nodes_common".
      # `pattern-8-bind-tools-in-phase-executor` still covers executor
      # construction in this same file.
      #
      # VALIDATORS — CLOSES WATCH 24, and forward-declared on purpose.
      # `backend/validation/**` does not exist yet; it arrives with layers 2c
      # and 2d at stage 7, where `ConstraintCheckResult` and `GraderVerdict`
      # are both builder-style calls in a validator (§4.6's mapping table).
      # WATCH 24 says to add it "then, in a governance commit of its own" —
      # this IS that commit, and landing it now costs nothing (the glob matches
      # no file today) while removing a block step 7.x would otherwise hit
      # cold. An exclusion for a path that does not exist excludes nothing.
      - 'agent-improve/backend/phases/nodes_common.py'
      - 'agent-improve/backend/validation/**'

  - id: pattern-5-plain-dict-routing
    regex: 'return\s+\{\s*["\'']next["\'']:'
    message: "Plain dict routing {'next': ...} is superseded. Return Command(goto=...) per LangGraph 1.2+ (EDUCATIONAL §44)."
    severity: block
    path_exclusions:
      - 'agent-resolve/**'
      # Governance documentation — see header.
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'
      - 'agent-improve/backend/phases/**/orchestrate.py'

  - id: pattern-8-bind-tools-in-phase-executor
    regex: 'llm\.bind_tools\s*\('
    message: "In phase executors, prefer create_agent(tools=[...]) over llm.bind_tools([...]). Governance rule CLAUDE.md §4.4 (middleware discipline)."
    severity: block
    path_exclusions:
      - 'agent-resolve/**'
      # Governance documentation — see header.
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'
      - 'agent-improve/backend/phases/**/orchestrate.py'

  # ── Anti-reinvention patterns (added 2026-08-31, CLAUDE.md §0.24) ──────
  #
  # Patterns 1-8 police SUPERSEDED APIs: a named thing that used to be right
  # and no longer is. These three police something different — building from
  # scratch a capability the framework already ships. There is no deprecated
  # name to grep for, because the drift is code that should never have been
  # written at all, so each matches a SHAPE instead.
  #
  # Shape-matching is looser than name-matching, so each is deliberately
  # narrow and each message names the framework feature to use instead plus
  # the reference section that specifies it. Verified 2026-08-31 against every
  # .py under agent-improve/backend/: zero matches on the tree as it stands,
  # so none of the three lands as a pre-existing violation.

  - id: pattern-9-hand-rolled-llm-retry
    regex: '(?is)(?:for\s+\w*(?:attempt|retry|retries|tries)\w*\s+in\s+range\s*\([^)\n]{0,40}\)\s*:(?:[^\n]*\n){0,12}?[^\n]*\.a?invoke\s*\(|while\s+[^\n:]{0,60}(?:attempt|retr|tries)[^\n:]{0,60}:(?:[^\n]*\n){0,12}?[^\n]*\.a?invoke\s*\(|for\s+\w+\s+in\s+range\s*\([^)\n]{0,40}\)\s*:(?:[^\n]*\n){0,15}?[^\n]*\.a?invoke\s*\((?:[^\n]*\n){0,15}?[^\n]*(?:time|asyncio)\.sleep\s*\()'
    message: "Hand-rolled retry loop around an LLM call. The framework ships this: ModelRetryMiddleware(max_retries=2) for model calls, ToolRetryMiddleware for tool calls, both on create_agent. Reference §19.4; CLAUDE.md §8.7 (hand-writing retry plumbing is BANNED) and §0.24. The keyword is max_retries, NOT retries."
    severity: block
    path_exclusions:
      # Governance documentation — see header.
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'

  - id: pattern-10-custom-llm-tracing
    regex: '(?i)(?:class\s+\w*(?:Callback|Tracer|Tracing|Telemetry|Instrument)\w*\s*\([^)\n]*\)|def\s+(?:log|track|record|emit|measure|count)_(?:llm|model|token|tokens|prompt|completion|inference)\w*\s*\(|class\s+\w*(?:LLM|Model|Token|Prompt|Completion)\w*(?:Metrics|Stats|Tracker|Monitor|Recorder)\w*\s*[(:])'
    message: "Custom tracing/metrics/callback layer for LLM calls. LangSmith already does this: set LANGCHAIN_TRACING_V2 and put @traceable on the function. Reference §51; CLAUDE.md §11.2 and §0.24. LangChain runnables and LangGraph nodes are traced automatically — @traceable is only for the plain Python functions between them."
    severity: block
    path_exclusions:
      # Governance documentation — see header.
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'
      # core/tracing.py is the LangSmith WIRING (init_tracing / tracing_enabled)
      # — the sanctioned path, not a replacement for it.
      - 'agent-improve/backend/core/tracing.py'

  - id: pattern-11-manual-state-persistence
    regex: '(?im)(?:def\s+(?:save|load|persist|restore|dump|write|read)_(?:state|checkpoint|checkpoints|graph_state|phase_state|session_state|conversation_state)\w*\s*\(|(?:json|pickle)\.dumps?\s*\(\s*(?:state|graph_state|phase_state)[,)\s]|^\s*(?:CHECKPOINTS|STATE_STORE|_checkpoints|_state_store)\s*(?::[^=\n]+)?=\s*\{)'
    message: "Manual checkpoint / state-persistence code. LangGraph owns this: the checkpointer persists graph state per thread_id, the store holds cross-phase artifacts. Reference §16; CLAUDE.md §1.7, §10.2 and §0.24. Attach both to the PARENT graph only — phase subgraphs compile with neither."
    severity: block
    path_exclusions:
      # Governance documentation — see header.
      - 'agent-improve/*.md'
      - 'agent-improve/**/*.md'
      # AzureBlobCheckpointSaver IMPLEMENTS BaseCheckpointSaver — it is the
      # framework primitive being given a backend, which is what §1.7
      # prescribes, not a hand-rolled replacement for it. Its test likewise.
      - 'agent-improve/backend/core/checkpointer.py'
      - 'agent-improve/backend/tests/test_checkpointer.py'

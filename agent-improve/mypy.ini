# Agent Improve — mypy configuration
# Added 2026-08-31 with the type-check gate (.claude/hooks/commit-msg-refactor-guard.py).
#
# PURPOSE, and the strictness reasoning
# ------------------------------------
# This config exists for ONE job: catch an invented LangGraph / LangChain /
# LangSmith method, or a wrong signature, against the REAL installed library's
# types. It is not a campaign to annotate the codebase.
#
# That job is achievable here because every library that matters ships a
# `py.typed` marker — verified 2026-08-31 in agent-improve/.venv:
#   langgraph ✓  langchain ✓  langchain_core ✓  langsmith ✓
#   langchain_openai ✓  pydantic ✓
# Without those markers mypy would see `Any` and the gate would be theatre.
#
# The strictness is deliberately NARROW. Full `strict = True` produces hundreds
# of errors on a v1 codebase that is almost entirely unannotated; the gate would
# block every commit, everyone would reach for --no-verify, and the check would
# stop meaning anything. A guard people route around is worse than no guard.

[mypy]
python_version = 3.11

# ── The setting that makes this gate able to fail at all ─────────────────
# Nearly every function in backend/ is unannotated. WITHOUT check_untyped_defs
# mypy skips their bodies entirely — it would report "Success" on a file full
# of invented API calls. This single line is the difference between a real
# check and a check that cannot fail.
check_untyped_defs = True

# ── Do NOT demand annotations ────────────────────────────────────────────
# Requiring them is a different project, and not the one the gate is for.
disallow_untyped_defs = False
disallow_incomplete_defs = False

# ── Pydantic plugin — REQUIRED, not optional ─────────────────────────────
# Without it mypy misreads Pydantic model constructors and invents false
# positives on the project's most common call shape. Proved before enabling:
# it reported `Unexpected keyword argument "max_tokens" for "AzureChatOpenAI"`
# at core/llm.py:39, against a field that demonstrably EXISTS
# (`"max_tokens" in AzureChatOpenAI.model_fields` is True). A gate that cries
# wolf on the mandated call path (CLAUDE.md §4.1) would be abandoned in a week.
plugins = pydantic.mypy

# ── Untyped third-party ──────────────────────────────────────────────────
# azure-*, scipy, pandas, openpyxl and friends ship no stubs. Without this,
# their import lines drown the output that matters. The libraries the gate
# actually polices carry py.typed, so they are checked regardless of this flag.
ignore_missing_imports = True

# ── Report only on the files we pass ─────────────────────────────────────
# The hook passes the CHANGED files. `silent` follows imports for type
# information but does not report errors in them, so a commit is judged on
# what it changed — not on debt in every module it happens to import.
follow_imports = silent

# ── Cheap, high-signal extras ────────────────────────────────────────────
warn_no_return = True
warn_redundant_casts = True
no_implicit_optional = True

# Convenience for a manual `mypy` run from agent-improve/. The hook always
# passes explicit paths and ignores this.
files = backend

[pydantic-mypy]
init_forbid_extra = False
init_typed = False
warn_required_dynamic_aliases = False
